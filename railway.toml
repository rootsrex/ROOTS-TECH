[build]
builder = "nixpacks"
buildCommand = "cd backend && npm install && sed -i 's/provider = \"sqlite\"/provider = \"postgresql\"/' prisma/schema.prisma && npx prisma generate && npm run build && npx prisma db push"

[deploy]
startCommand = "cd backend && node dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "dancepay"
